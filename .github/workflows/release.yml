name: release

# A release is produced from a tag alone, the same rule hvolt follows: nothing is built
# on a developer machine.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify only; do not create a release or publish"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: package and release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: node build.mjs
      - run: node --test test/

      # A tag that disagrees with the manifest would publish the wrong version under the
      # wrong name; fail before anything leaves the runner.
      - name: tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          echo "tag=$tag manifest=$version"
          test "$tag" = "$version"

      - name: package vsix
        id: package
        run: |
          npx --yes @vscode/vsce@3 package --no-dependencies --out "hvolt-vscode-${GITHUB_REF_NAME#v}.vsix"
          echo "file=hvolt-vscode-${GITHUB_REF_NAME#v}.vsix" >> "$GITHUB_OUTPUT"

      - name: create the release
        if: startsWith(github.ref, 'refs/tags/v') && (github.event.inputs.dry_run != 'true')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.file }}
          generate_release_notes: true

      # Publishing needs a Marketplace token (`VSCE_PAT`). Without it the release still
      # produces the .vsix, so the extension is installable from the release page.
      - name: publish to the marketplace
        if: startsWith(github.ref, 'refs/tags/v') && (github.event.inputs.dry_run != 'true') && env.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce@3 publish --no-dependencies --packagePath "${{ steps.package.outputs.file }}"
